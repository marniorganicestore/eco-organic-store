server:
  port: ${PORT:8081}
spring:
  application:
    name: identity-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/identity}
  threads:
    virtual:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me-please}
  internal-key: ${INTERNAL_API_KEY:internal-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    email: ${ADMIN_EMAIL:admin@eco-organic-store.com}
    name: ${ADMIN_NAME:Store Admin}
    password: ${ADMIN_PASSWORD:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  storefront-url: ${STOREFRONT_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:admin@eco-organic-store.com}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:admin@eco-organic-store.com}
    from-name: ${MAIL_FROM_NAME:Marni eco organic store}
    admin: ${MAIL_ADMIN:admin@eco-organic-store.com}