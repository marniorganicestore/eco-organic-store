server:
  port: ${PORT:8081}
spring:
  application:
    name: identity-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/identity}
  threads:
    virtual:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me-please}
  internal-key: ${INTERNAL_API_KEY:internal-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    email: ${ADMIN_EMAIL:admin@harvest.co}
    name: ${ADMIN_NAME:Harvest Admin}
    password: ${ADMIN_PASSWORD:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}