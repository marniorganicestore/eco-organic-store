server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  servlet:
    multipart:
      # Stream uploads to identity and catalog. Parsing them here consumes the body,
      # and POST /api/me/avatar then fails with an unexpected 500.
      enabled: false
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 5s
      # Must stay under the Azure ingress limit (240s) so a stuck checkout returns from this app, with CORS.
      read-timeout: 90s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/me,/api/me/**,/api/avatars/**,/api/admin/users,/api/admin/users/**
            - id: review-product-routes
              uri: ${REVIEW_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/products/*/reviews
            - id: catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/categories/**,/api/products/**,/api/admin/catalog/**,/api/media/**
            - id: cart
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**
            - id: inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/admin/inventory/**
            - id: order
              uri: ${ORDER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/checkout/**,/api/orders/**,/api/admin/orders/**
            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/webhooks/razorpay,/api/payments/verify,/api/payments/razorpay/callback,/api/admin/payments/**
            - id: review
              uri: ${REVIEW_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/reviews/**,/api/admin/reviews/**

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me-please}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://eco-organic-store.com,https://www.eco-organic-store.com}