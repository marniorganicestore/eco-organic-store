server:
  port: ${PORT:8086}
spring:
  application:
    name: payment-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/payment}
  threads:
    virtual:
      enabled: true
app:
  internal-key: ${INTERNAL_API_KEY:internal-secret}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/order/success?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/cart}
services:
  order: ${ORDER_SERVICE_URL:http://localhost:8085}