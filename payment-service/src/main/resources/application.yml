server:
  port: ${PORT:8086}
spring:
  application:
    name: payment-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/payment}
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true
app:
  internal-key: ${INTERNAL_API_KEY:internal-secret}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    callback-url: ${RAZORPAY_CALLBACK_URL:http://localhost:8080/api/payments/razorpay/callback}
    success-url: ${RAZORPAY_SUCCESS_URL:http://localhost:5173/order/success}
    cancel-url: ${RAZORPAY_CANCEL_URL:http://localhost:5173/cart}
services:
  order: ${ORDER_SERVICE_URL:http://localhost:8085}