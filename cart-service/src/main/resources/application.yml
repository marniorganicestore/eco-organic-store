server:
  port: ${PORT:8083}
spring:
  application:
    name: cart-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/cart}
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true
app:
  internal-key: ${INTERNAL_API_KEY:internal-secret}
services:
  catalog: ${CATALOG_SERVICE_URL:http://localhost:8082}
  inventory: ${INVENTORY_SERVICE_URL:http://localhost:8084}