name: Docker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  TAG: ${{ github.sha }}

jobs:
  bake:
    name: Bake
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase GHCR prefix
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake images
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          provenance: false
          sbom: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Tag latest on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for image in gateway identity-service catalog-service cart-service inventory-service order-service payment-service review-service frontend; do
            docker buildx imagetools create \
              --tag "${REGISTRY}/${image}:latest" \
              "${REGISTRY}/${image}:${TAG}"
          done
