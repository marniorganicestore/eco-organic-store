server:
  port: ${PORT:8087}
spring:
  application:
    name: review-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/review}
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true
app:
  internal-key: ${INTERNAL_API_KEY:internal-secret}
services:
  order: ${ORDER_SERVICE_URL:http://localhost:8085}
  catalog: ${CATALOG_SERVICE_URL:http://localhost:8082}